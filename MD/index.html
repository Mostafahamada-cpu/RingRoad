  const FORM_ACTIONS = ['auth-submit', 'save-property', 'save-client', 'save-fu', 'save-deal'];

  function initEvents() {
    const root = document.getElementById('app-root');

    root.addEventListener('click', (e) => {
      // Backdrop click closes the relevant modal (target is the overlay itself,
      // not a child — children never carry the .overlay class).
      if (e.target.classList && e.target.classList.contains('overlay')) {
        const which = e.target.dataset.overlay;
        if (which === 'form') actions['close-form']();
        else if (which === 'client-form') actions['close-client-form']();
        else if (which === 'fu-form') actions['close-fu-form']();
        else if (which === 'deal-form') actions['close-deal-form']();
        else if (which === 'quote') actions['close-quote']();
        else if (which === 'ai') actions['close-ai']();
        return;
      }
      const el = e.target.closest ? e.target.closest('[data-action]') : null;
      if (!el) return;
      const name = el.dataset.action;
      if (FORM_ACTIONS.includes(name)) return; // handled via 'submit'
      if (el.tagName === 'A') return;          // real links (tel:, wa.me, maps) pass through
      if (actions[name]) { e.preventDefault(); actions[name](el, e); }
    });

    root.addEventListener('submit', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      e.preventDefault();
      const name = el.dataset.action;
      if (name === 'auth-submit') handleAuthSubmit();
      else if (name === 'save-property') saveProperty(el);
      else if (name === 'save-client') saveClient(el);
      else if (name === 'save-fu') saveFu(el);
      else if (name === 'save-deal') saveDeal(el);
    });

    // Inputs that re-render only a subtree (preserve caret position).
    root.addEventListener('input', (e) => {
      const calcKey = e.target.dataset.calc;
      if (calcKey) {
        state.calc[calcKey] = e.target.value;
        const box = document.getElementById('calc-results');
        if (box) box.innerHTML = renderCalcResults();
        return;
      }
      const searchKind = e.target.dataset.search;
      if (searchKind === 'prop') {
        state.propSearch = e.target.value;
        const box = document.getElementById('prop-list');
        if (box) box.innerHTML = renderPropList();
        return;
      }
      if (searchKind === 'client') {
        state.clientSearch = e.target.value;
        const box = document.getElementById('client-list');
        if (box) box.innerHTML = renderClientList();
        return;
      }
    });

    root.addEventListener('change', (e) => {
      const el = e.target;
      // quick stage change on an expanded client card
      if (el.dataset.clientStage) { changeClientStage(el.dataset.clientStage, el.value); return; }
      // deal form: picking a property autofills the deal value
      if (el.hasAttribute && el.hasAttribute('data-deal-prop')) {
        const opt = el.selectedOptions && el.selectedOptions[0];
        const price = opt ? opt.dataset.price : '';
        const valueInput = document.getElementById('deal-value');
        if (price && valueInput) valueInput.value = price;
        return;
      }
      const which = el.dataset.actionChange;
      if (which === 'calc-prop') {
        state.calc.propId = el.value;
        const p = propById(el.value);
        if (p) state.calc.price = String(p.price);
        renderRoot();
        return;
      }
      if (which === 'hist-filter') {
        state[el.dataset.key] = el.value;
        renderRoot();
        return;
      }
    });

    // Chart tooltip (hover layer) — one shared tip element, delegated globally.
    const tip = document.getElementById('charttip');
    document.addEventListener('mousemove', (e) => {
      const el = e.target.closest ? e.target.closest('[data-tip]') : null;
      if (el) {
        tip.textContent = el.dataset.tip;
        tip.classList.add('on');
        const x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8);
        tip.style.left = Math.max(4, x) + 'px';
        tip.style.top = Math.max(4, e.clientY - 36) + 'px';
      } else {
        tip.classList.remove('on');
      }
    });
    // Touch: tapping a bar shows the tip briefly.
    let tipTimer = null;
    document.addEventListener('click', (e) => {
      const el = e.target.closest ? e.target.closest('.cbar[data-tip]') : null;
      if (!el) return;
      const rect = el.getBoundingClientRect();
      tip.textContent = el.dataset.tip;
      tip.classList.add('on');
      tip.style.left = Math.max(4, Math.min(rect.left, window.innerWidth - tip.offsetWidth - 8)) + 'px';
      tip.style.top = Math.max(4, rect.top - 34) + 'px';
      clearTimeout(tipTimer);
      tipTimer = setTimeout(() => tip.classList.remove('on'), 1800);
    });
  }

  /* ===================================================================== */
  /* 29.  SAVE / MUTATE HANDLERS                                            */
  /* ===================================================================== */
  async function saveProperty(formEl) {
    const fd = new FormData(formEl);
    const images = String(fd.get('images') || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    const row = {
      code: (fd.get('code') || '').trim(),
      icon: fd.get('icon') || '🏠',
      status: fd.get('status') || 'available',
      type: fd.get('type') || 'sale',
      price: num(fd.get('price')),
      beds: parseInt(fd.get('beds'), 10) || 0,
      baths: parseInt(fd.get('baths'), 10) || 0,
      area: (fd.get('area') || '').toString().trim() === '' ? null : num(fd.get('area')),
      project: (fd.get('project') || '').trim() || null,
      developer: (fd.get('developer') || '').trim() || null,
      unit_type: fd.get('unit_type') || null,
      delivery: fd.get('delivery') || null,
      payment_plan: (fd.get('payment_plan') || '').trim() || null,
      map_url: (fd.get('map_url') || '').trim() || null,
      images,
      address_en: (fd.get('address_en') || '').trim(),
      address_ar: (fd.get('address_ar') || '').trim(),
      finish_en: (fd.get('finish_en') || '').trim() || null,
      finish_ar: (fd.get('finish_ar') || '').trim() || null,
      unit_en: (fd.get('unit_en') || '').trim() || null,
      unit_ar: (fd.get('unit_ar') || '').trim() || null,
      agent_en: (fd.get('agent_en') || '').trim() || null,
      agent_ar: (fd.get('agent_ar') || '').trim() || null,
      registered: fd.get('registered') || null,
    };
    if (!row.code || !row.address_en || !row.address_ar) {
      state.formError = '⚠ ' + t('code') + ' / ' + t('addressEn') + ' / ' + t('addressAr');
      renderRoot(); return;
    }
    state.formBusy = true; state.formError = null; renderRoot();
    try {
      if (state.editing) {
        const updated = await rest.update('properties', state.editing.id, row);
        const rowData = Array.isArray(updated) ? updated[0] : updated;
        const i = state.properties.findIndex(p => p.id === state.editing.id);
        if (i >= 0 && rowData) state.properties[i] = rowData;
      } else {
        const created = await rest.create('properties', row);
        const rowData = Array.isArray(created) ? created[0] : created;
        if (rowData) state.properties.push(rowData);
        state.properties.sort((a, b) => String(a.code).localeCompare(String(b.code)));
      }
      state.formOpen = false; state.editing = null;
      renderRoot();
      toast(t('saved'));
    } catch (err) {
      state.formError = err.message;
      renderRoot();
    } finally {
      state.formBusy = false;
    }
  }

  async function saveClient(formEl) {
    const fd = new FormData(formEl);
    const row = {
      name: (fd.get('name') || '').trim(),
      phone: (fd.get('phone') || '').trim() || null,
      email: (fd.get('email') || '').trim() || null,
      budget: (fd.get('budget') || '').toString().trim() === '' ? null : num(fd.get('budget')),
      preferred_area: (fd.get('preferred_area') || '').trim() || null,
      preferred_unit_type: fd.get('preferred_unit_type') || null,
      notes: (fd.get('notes') || '').trim() || null,
      stage: fd.get('stage') || 'new_lead',
    };
    if (!row.name) { state.clientFormError = '⚠ ' + t('clientName'); renderRoot(); return; }
    state.clientFormBusy = true; state.clientFormError = null; renderRoot();
    try {
      if (state.editingClient) {
        const updated = await rest.update('clients', state.editingClient.id, row);
        const rowData = Array.isArray(updated) ? updated[0] : updated;
        const i = state.clients.findIndex(c => c.id === state.editingClient.id);
        if (i >= 0 && rowData) state.clients[i] = rowData;
      } else {
        const created = await rest.create('clients', row);
        const rowData = Array.isArray(created) ? created[0] : created;
        if (rowData) state.clients.unshift(rowData);
      }
      state.clientFormOpen = false; state.editingClient = null;
      renderRoot();
      toast(t('saved'));
    } catch (err) {
      state.clientFormError = err.message;
      renderRoot();
    } finally {
      state.clientFormBusy = false;
    }
  }

  async function changeClientStage(id, stage) {
    const c = clientById(id);
    if (!c) return;
    const prev = c.stage;
    c.stage = stage;
    renderRoot();
    try {
      await rest.update('clients', id, { stage });
      toast(t('saved'));
    } catch (err) {
      c.stage = prev;
      renderRoot();
      toast(err.message);
    }
  }

  async function saveFu(formEl) {
    const fd = new FormData(formEl);
    const date = fd.get('due_date'), time = fd.get('due_time') || '09:00';
    const due = new Date(date + 'T' + time);
    const row = {
      title: (fd.get('title') || '').trim(),
      client_id: fd.get('client_id') || null,
      kind: fd.get('kind') || 'call',
      due_at: isNaN(due) ? null : due.toISOString(),
      notes: (fd.get('notes') || '').trim() || null,
    };
    if (!row.title || !row.due_at) { state.fuFormError = '⚠ ' + t('fuTitle') + ' / ' + t('dueDate'); renderRoot(); return; }
    state.fuFormBusy = true; state.fuFormError = null; renderRoot();
    try {
      if (state.editingFu) {
        const updated = await rest.update('followups', state.editingFu.id, row);
        const rowData = Array.isArray(updated) ? updated[0] : updated;
        const i = state.followups.findIndex(f => f.id === state.editingFu.id);
        if (i >= 0 && rowData) state.followups[i] = rowData;
      } else {
        const created = await rest.create('followups', row);
        const rowData = Array.isArray(created) ? created[0] : created;
        if (rowData) state.followups.push(rowData);
      }
      state.followups.sort((a, b) => String(a.due_at).localeCompare(String(b.due_at)));
      state.fuFormOpen = false; state.editingFu = null; state.fuPrefillClient = '';
      renderRoot();
      toast(t('saved'));
    } catch (err) {
      state.fuFormError = err.message;
      renderRoot();
    } finally {
      state.fuFormBusy = false;
    }
  }

  async function toggleFuDone(id) {
    const f = state.followups.find(x => x.id === id);
    if (!f) return;
    f.done = !f.done;
    renderRoot();
    try {
      await rest.update('followups', id, { done: f.done });
    } catch (err) {
      f.done = !f.done;
      renderRoot();
      toast(err.message);
    }
  }

  async function saveDeal(formEl) {
    const fd = new FormData(formEl);
    const stage = fd.get('stage') || 'lead';
    const row = {
      client_id: fd.get('client_id') || null,
      property_id: fd.get('property_id') || null,
      agent: (fd.get('agent') || '').trim() || null,
      value: num(fd.get('value')),
      commission_pct: num(fd.get('commission_pct')),
      agent_share_pct: num(fd.get('agent_share_pct')),
      company_share_pct: num(fd.get('company_share_pct')),
      stage,
      closed_at: stage === 'closed'
        ? ((state.editingDeal && state.editingDeal.closed_at) || todayKey())
        : null,
    };
    state.dealFormBusy = true; state.dealFormError = null; renderRoot();
    try {
      if (state.editingDeal) {
        const updated = await rest.update('deals', state.editingDeal.id, row);
        const rowData = Array.isArray(updated) ? updated[0] : updated;
        const i = state.deals.findIndex(d => d.id === state.editingDeal.id);
        if (i >= 0 && rowData) state.deals[i] = rowData;
      } else {
        const created = await rest.create('deals', row);
        const rowData = Array.isArray(created) ? created[0] : created;
        if (rowData) state.deals.unshift(rowData);
      }
      state.dealFormOpen = false; state.editingDeal = null;
      renderRoot();
      toast(t('saved'));
    } catch (err) {
      state.dealFormError = err.message;
      renderRoot();
    } finally {
      state.dealFormBusy = false;
    }
  }

  async function moveDeal(id, dir) {
    const d = state.deals.find(x => x.id === id);
    if (!d) return;
    const idx = DEAL_STAGES.indexOf(d.stage);
    const next = DEAL_STAGES[idx + dir];
    if (!next) return;
    const prev = { stage: d.stage, closed_at: d.closed_at };
    d.stage = next;
    if (next === 'closed' && !d.closed_at) d.closed_at = todayKey();
    if (next !== 'closed') d.closed_at = null;
    renderRoot();
    try {
      await rest.update('deals', id, { stage: d.stage, closed_at: d.closed_at });
    } catch (err) {
      d.stage = prev.stage; d.closed_at = prev.closed_at;
      renderRoot();
      toast(err.message);
    }
  }

  async function doConfirmedDelete() {
    const cd = state.confirmDel;
    if (!cd) return;
    state.confirmDel = null;
    try {
      if (cd.kind === 'property') {
        await rest.remove('properties', cd.id);
        state.properties = state.properties.filter(p => p.id !== cd.id);
        state.deals.forEach(d => { if (d.property_id === cd.id) d.property_id = null; });
        if (state.expandedId === cd.id) state.expandedId = null;
      } else if (cd.kind === 'client') {
        await rest.remove('clients', cd.id);
        state.clients = state.clients.filter(c => c.id !== cd.id);
        state.followups = state.followups.filter(f => f.client_id !== cd.id);
        state.deals.forEach(d => { if (d.client_id === cd.id) d.client_id = null; });
        if (state.expandedClientId === cd.id) state.expandedClientId = null;
      } else if (cd.kind === 'deal') {
        await rest.remove('deals', cd.id);
        state.deals = state.deals.filter(d => d.id !== cd.id);
        state.dealFormOpen = false; state.editingDeal = null;
      } else if (cd.kind === 'followup') {
        await rest.remove('followups', cd.id);
        state.followups = state.followups.filter(f => f.id !== cd.id);
        state.fuFormOpen = false; state.editingFu = null;
      }
      renderRoot();
      toast(t('deleted'));
    } catch (err) {
      renderRoot();
      toast(err.message);
    }
  }

  /* ===================================================================== */
  /* 30.  INIT                                                              */
  /* ===================================================================== */
  async function init() {
    initEvents();
    await restoreSession();
    renderRoot();
    if (state.session) loadAll();
    setInterval(checkDueFollowups, 60000);
  }
  init();
  </script>
