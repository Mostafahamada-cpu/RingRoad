<!DOCTYPE html>
<!-- ============================================================================
     Ring Roads — Bilingual (EN/AR) real-estate broker CRM.
     Single-file app: HTML structure + CSS (custom properties) + vanilla JS.
     Backend: Supabase (Auth via GoTrue REST + data via PostgREST), fetch() only.
     Only third-party lib: html2canvas (CDN) for the quote PNG export.
     No build step, no bundler, no framework. Open in a browser and it works.

     Modules: Dashboard · Properties · Clients CRM · Follow-ups · Deals pipeline
              Commission calculator · Commission history (CSV/PDF) · Analytics
              AI property matching · Dark/light mode
     Database schema: see SETUP.md. Architecture & flows: see ARCHITECTURE.md.
     ========================================================================= -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f4c81">
  <title>Ring Roads</title>

  <!-- 1. FONTS (Cairo — single family carrying Latin + Arabic) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- html2canvas — quote PNG export -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
  /* ===================================================================== */
  /* 2.1  DESIGN TOKENS                                                     */
  /* ===================================================================== */
  :root {
    --font-sans: "Cairo", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --font-arabic: "Cairo", "Segoe UI", Tahoma, sans-serif;

    --blue-900:#0a2a4e; --blue-800:#0d3a6b; --blue-700:#0f4c81; --blue-600:#1560a3;
    --blue-500:#2e7cd6; --blue-400:#5a9be0; --blue-300:#8fbdea; --blue-200:#bcd8f2;
    --blue-100:#ddeafa; --blue-50:#eef5fc;
    --white:#ffffff;
    --gray-50:#f5f8fc; --gray-100:#edf1f7; --gray-200:#e1e8f0; --gray-300:#cbd5e1;
    --gray-500:#5b6b7f; --gray-700:#33414f; --gray-900:#1a2433;
    --success:#16a34a; --success-bg:#dcfce7;
    --error:#dc2626;   --error-bg:#fee2e2;
    --warning:#d97706; --warning-bg:#fef3c7;

    --brand: var(--blue-700); --brand-strong: var(--blue-900); --brand-accent: var(--blue-500);
    --surface-app: var(--gray-50); --surface-card: var(--white);
    --surface-tint: var(--blue-50); --surface-invert: var(--blue-700);
    --surface-sunken: var(--gray-100);
    --text-heading: var(--blue-700); --text-body-color: var(--gray-900);
    --text-muted: var(--gray-500); --text-on-brand: var(--white); --text-accent: var(--blue-500);
    --border-default: var(--gray-200); --border-strong: var(--gray-300); --border-accent: var(--blue-500);
    --focus-ring: var(--blue-400);

    --chart-bar:#2e7cd6; --chart-bar-soft:#ddeafa;

    --text-display:28px; --text-h1:22px; --text-h2:18px; --text-h3:16px;
    --text-body:14px; --text-sm:13px; --text-xs:12px; --text-2xs:11px;
    --weight-regular:400; --weight-medium:500; --weight-semibold:600; --weight-bold:700; --weight-extra:800;
    --leading-tight:1.2; --leading-snug:1.35; --leading-normal:1.55; --tracking-label:0.02em;

    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
    --space-6:24px; --space-8:32px; --space-10:40px;
    --radius-xs:6px; --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-pill:999px;
    --shadow-sm: 0 1px 3px rgba(15,76,129,.08);
    --shadow-card: 0 2px 6px rgba(15,76,129,.10);
    --shadow-stat: 0 2px 8px rgba(15,76,129,.12);
    --shadow-lg: 0 8px 24px rgba(10,42,78,.16);
  }

  /* Dark theme — semantic tokens only; raw ramps stay untouched so the
     light-locked quote template keeps its print colors. */
  html[data-theme="dark"] {
    color-scheme: dark;
    --surface-app:#0b1524; --surface-card:#13243a; --surface-tint:#1b3252;
    --surface-sunken:#0e1c30;
    --text-heading:#9cc3ee; --text-body-color:#dce8f5; --text-muted:#8ea3bb;
    --border-default:#223853; --border-strong:#2e4a6b;
    --success:#4ade80; --success-bg:rgba(34,197,94,.16);
    --error:#f87171;   --error-bg:rgba(239,68,68,.16);
    --warning:#fbbf24; --warning-bg:rgba(245,158,11,.18);
    --focus-ring:#5a9be0;
    --chart-bar:#5093de; --chart-bar-soft:#28405e; /* validated vs #13243a card surface */
    --shadow-sm: 0 1px 3px rgba(0,0,0,.40);
    --shadow-card: 0 2px 8px rgba(0,0,0,.45);
    --shadow-stat: 0 2px 8px rgba(0,0,0,.50);
    --shadow-lg: 0 8px 28px rgba(0,0,0,.60);
  }

  /* ===================================================================== */
  /* 2.2  RESET & BASE                                                     */
  /* ===================================================================== */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: var(--text-body);
    color: var(--text-body-color);
    background: var(--surface-app);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; }
  a { color: var(--brand-accent); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }

  /* ===================================================================== */
  /* 2.3  APP SHELL / LAYOUT                                                */
  /* ===================================================================== */
  #app-root { min-height: 100%; display: flex; flex-direction: column; }

  .shell {
    width: 100%;
    max-width: 480px;
    margin-inline: auto;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--surface-app);
    position: relative;
  }
  .shell__header {
    background: var(--brand);
    color: var(--text-on-brand);
    padding: var(--space-4) var(--space-4) var(--space-5);
    border-bottom-left-radius: var(--radius-lg);
    border-bottom-right-radius: var(--radius-lg);
    position: sticky; top: 0; z-index: 20;
  }
  .htop { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
  .brand {
    display: flex; align-items: center; gap: var(--space-2);
    font-size: var(--text-h1); font-weight: var(--weight-extra); letter-spacing: -0.01em;
    line-height: var(--leading-tight);
  }
  .brand .brand__glyph { font-size: 0.9em; }
  .subtitle { font-size: var(--text-sm); color: var(--blue-200); margin-top: 2px; }

  .header-actions { display: flex; align-items: center; gap: var(--space-2); flex-shrink: 0; }
  .langtoggle {
    display: flex; gap: 2px; background: rgba(255,255,255,0.15);
    border-radius: var(--radius-pill); padding: 3px;
  }
  .langtoggle button {
    border: none; background: transparent; color: #fff; font-weight: var(--weight-bold);
    font-size: var(--text-xs); padding: 5px 10px; border-radius: var(--radius-pill);
    cursor: pointer; transition: background .15s ease, color .15s ease;
  }
  .langtoggle button.on { background: #fff; color: var(--brand); }
  .icon-btn {
    border: none; background: rgba(255,255,255,0.15); color: #fff;
    width: 34px; height: 34px; border-radius: var(--radius-pill); cursor: pointer;
    font-size: var(--text-body); display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s ease;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.28); }

  .shell__scroll { flex: 1; overflow-y: auto; padding-bottom: 96px; }
  .screen { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); animation: fadeUp .22s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .tabwrap {
    position: sticky; bottom: 0; z-index: 20;
    background: var(--surface-card); border-top: 1px solid var(--border-default);
  }

  /* ===================================================================== */
  /* 2.4  COMPONENTS                                                        */
  /* ===================================================================== */

  /* --- Button --- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
    font-family: var(--font-sans); font-weight: var(--weight-semibold);
    border-radius: var(--radius-sm); cursor: pointer;
    border: 1px solid transparent; padding: 12px 18px; font-size: var(--text-body);
    transition: filter .15s ease, transform .05s ease, background .15s ease, color .15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn--primary   { background: var(--brand); color: var(--text-on-brand); border-color: var(--brand); }
  .btn--primary:hover:not(:disabled)   { filter: brightness(1.08); }
  .btn--secondary { background: var(--surface-tint); color: var(--text-heading); border-color: transparent; }
  .btn--secondary:hover:not(:disabled) { filter: brightness(0.97); }
  .btn--ghost     { background: transparent; color: var(--brand-accent); }
  .btn--ghost:hover:not(:disabled)     { background: var(--surface-tint); }
  .btn--danger    { background: transparent; color: var(--error); border-color: transparent; }
  .btn--danger:hover:not(:disabled)    { background: var(--error-bg); }
  .btn--sm { padding: 8px 14px; font-size: var(--text-sm); }
  .btn--lg { padding: 14px 22px; font-size: var(--text-h3); }
  .btn--block { width: 100%; }
  .btn__icon { font-size: 1.1em; line-height: 1; }

  /* --- Input --- */
  .field { display: block; }
  .field__label {
    display: block; font-size: var(--text-sm); font-weight: var(--weight-semibold);
    color: var(--text-body-color); margin-bottom: var(--space-2);
  }
  .field__wrap { position: relative; display: flex; align-items: center; }
  .field__input, .field__select, .field__textarea {
    width: 100%; font-family: var(--font-sans); font-size: var(--text-body);
    color: var(--text-body-color); background: var(--surface-app);
    border: 1px solid var(--border-default); border-radius: var(--radius-sm);
    padding: 10px 12px; outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field__textarea { resize: vertical; min-height: 64px; }
  .field__input:focus, .field__select:focus, .field__textarea:focus {
    border-color: var(--border-accent); box-shadow: 0 0 0 3px var(--chart-bar-soft);
  }
  .field__wrap--suffix .field__input { padding-inline-end: 42px; }
  .field__suffix {
    position: absolute; inset-inline-end: 12px; font-size: var(--text-sm);
    font-weight: var(--weight-semibold); color: var(--text-muted); pointer-events: none;
  }

  /* --- Segmented control --- */
  .segmented { display: inline-flex; background: var(--surface-app);
    border: 1px solid var(--border-default); border-radius: var(--radius-sm); padding: 3px; gap: 3px; }
  .segmented button {
    border: none; background: transparent; cursor: pointer; padding: 7px 16px;
    border-radius: var(--radius-xs); font-size: var(--text-sm); font-weight: var(--weight-semibold);
    color: var(--text-muted); transition: background .15s ease, color .15s ease;
  }
  .segmented button.on { background: var(--brand); color: #fff; }

  /* --- TabBar (5 tabs, icon over label) --- */
  .tabbar { display: flex; gap: 4px; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
  .tabbar__tab {
    flex: 1; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    padding: 8px 2px; border-radius: var(--radius-sm); border: none; cursor: pointer;
    font-size: var(--text-2xs); font-weight: var(--weight-semibold);
    background: transparent; color: var(--text-muted);
    transition: background .15s ease, color .15s ease;
  }
  .tabbar__tab .ticon { font-size: 18px; line-height: 1; }
  .tabbar__tab.on { background: var(--brand); color: var(--text-on-brand); }

  /* --- Panel --- */
  .panel {
    background: var(--surface-card); border-radius: var(--radius-md);
    box-shadow: var(--shadow-card); padding: var(--space-4);
    border-inline-start: 4px solid var(--border-accent);
  }
  .panel--brand   { border-inline-start-color: var(--brand); }
  .panel--success { border-inline-start-color: var(--success); }
  .panel--warning { border-inline-start-color: var(--warning); }
  .panel__title {
    margin: 0 0 var(--space-4); font-size: var(--text-h3);
    font-weight: var(--weight-semibold); color: var(--text-heading);
  }
  .panel__head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); margin-bottom: var(--space-4); }
  .panel__head .panel__title { margin: 0; }
  .panel__more { border: none; background: none; color: var(--brand-accent); font-weight: var(--weight-semibold); font-size: var(--text-xs); cursor: pointer; }

  /* --- StatCard --- */
  .statrow { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
  .statrow--4 { grid-template-columns: repeat(4, 1fr); }
  .statcard {
    background: var(--surface-card); border-radius: var(--radius-md);
    box-shadow: var(--shadow-stat); padding: var(--space-3); text-align: center;
    border-inline-start: 4px solid var(--border-accent); min-width: 0;
  }
  .statcard__value {
    font-size: var(--text-h1); font-weight: var(--weight-bold); color: var(--text-heading);
    margin-bottom: var(--space-1); line-height: var(--leading-tight); overflow: hidden; text-overflow: ellipsis;
  }
  .statcard__label { font-size: var(--text-xs); color: var(--text-muted); line-height: var(--leading-snug); }
  .statcard--success { border-inline-start-color: var(--success); }
  .statcard--success .statcard__value { color: var(--success); }
  .statcard--warning { border-inline-start-color: var(--warning); }

  /* --- Chips (filters) --- */
  .chips { display: flex; gap: var(--space-2); overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    border: 1px solid var(--border-default); background: var(--surface-card); color: var(--text-muted);
    border-radius: var(--radius-pill); padding: 6px 12px; font-size: var(--text-xs);
    font-weight: var(--weight-semibold); cursor: pointer; white-space: nowrap; flex-shrink: 0;
    transition: background .15s ease, color .15s ease;
  }
  .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .chip .cnt { opacity: .72; margin-inline-start: 4px; }

  /* --- PropertyCard --- */
  .plist { display: flex; flex-direction: column; gap: var(--space-3); }
  .pcard {
    background: var(--surface-card); border-radius: var(--radius-md);
    border: 1px solid var(--border-default); box-shadow: var(--shadow-card); overflow: hidden;
    transition: border-color .15s ease;
  }
  .pcard.is-open { border-color: var(--border-accent); }
  .pcard__header {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
    padding: var(--space-4); background: transparent; border: none;
    border-bottom: 1px solid var(--border-default); cursor: pointer;
    text-align: start; color: inherit;
  }
  .pcard__id { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
  .pcard__icon { font-size: 28px; line-height: 1; }
  .pcard__code { display: block; font-size: var(--text-body); font-weight: var(--weight-semibold); color: var(--text-heading); }
  .pcard__addr { display: block; font-size: var(--text-sm); color: var(--text-muted); }
  .pcard__meta { text-align: end; flex-shrink: 0; }
  .pcard__price { display: block; font-size: var(--text-sm); font-weight: var(--weight-bold); color: var(--text-heading); margin-bottom: var(--space-1); }
  .pcard__quick { display: flex; padding: var(--space-3) var(--space-4); background: var(--surface-app); border-bottom: 1px solid var(--border-default); }
  .pcard__quick > div { flex: 1; text-align: center; min-width: 0; }
  .quick__k { font-size: var(--text-2xs); color: var(--text-muted); margin-bottom: 2px; }
  .quick__v { font-size: var(--text-body); font-weight: var(--weight-semibold); color: var(--text-heading); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pcard__details { padding: var(--space-2) var(--space-4) var(--space-3); background: var(--surface-app); }
  .drow { display: flex; justify-content: space-between; gap: var(--space-3); padding: var(--space-2) 0; border-bottom: 1px solid var(--border-default); }
  .drow:last-child { border-bottom: none; }
  .drow__k { font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--text-muted); flex-shrink: 0; }
  .drow__v { font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--text-heading); text-align: end; overflow-wrap: anywhere; }
  .pcard__actions { display: flex; gap: var(--space-2); padding: var(--space-3) var(--space-4) var(--space-4); background: var(--surface-app); flex-wrap: wrap; }

  /* --- Gallery + lightbox --- */
  .gallery { display: flex; gap: var(--space-2); overflow-x: auto; padding: var(--space-2) 0; }
  .gallery img {
    height: 76px; width: 110px; object-fit: cover; flex-shrink: 0;
    border-radius: var(--radius-sm); cursor: pointer; border: 1px solid var(--border-default);
  }
  .lightbox {
    position: fixed; inset: 0; z-index: 80; background: rgba(4,14,26,.85);
    display: flex; align-items: center; justify-content: center; padding: var(--space-4); cursor: zoom-out;
  }
  .lightbox img { max-width: 100%; max-height: 90vh; border-radius: var(--radius-md); }

  /* --- StatusBadge --- */
  .badge {
    display: inline-block; font-size: var(--text-2xs); font-weight: var(--weight-semibold);
    padding: 4px 8px; border-radius: var(--radius-xs); line-height: 1; white-space: nowrap;
  }
  .badge--available { color: var(--success); background: var(--success-bg); }
  .badge--reserved  { color: var(--warning); background: var(--warning-bg); }
  .badge--sold      { color: var(--error);   background: var(--error-bg); }
  .badge--rented    { color: var(--text-muted); background: var(--surface-tint); }

  /* --- Stage chip (client / deal stages) --- */
  .stagechip {
    display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-2xs);
    font-weight: var(--weight-semibold); background: var(--surface-tint); color: var(--text-heading);
    padding: 4px 10px; border-radius: var(--radius-pill); white-space: nowrap;
  }
  .stagechip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--stage-c, var(--blue-500)); flex-shrink: 0; }

  /* --- Avatar --- */
  .avatar {
    width: 42px; height: 42px; border-radius: 50%; background: var(--surface-tint); color: var(--text-heading);
    font-weight: var(--weight-extra); display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: var(--text-h3);
  }

  /* --- Follow-up row --- */
  .fugroup { display: flex; flex-direction: column; gap: var(--space-2); }
  .fugroup__title { font-size: var(--text-xs); font-weight: var(--weight-bold); color: var(--text-muted);
    text-transform: uppercase; letter-spacing: var(--tracking-label); margin: var(--space-2) 0 0; }
  .furow {
    display: flex; gap: var(--space-3); align-items: flex-start; padding: var(--space-3);
    background: var(--surface-card); border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
    border-inline-start: 4px solid var(--border-accent);
  }
  .furow.is-late { border-inline-start-color: var(--error); }
  .furow.is-done { opacity: .55; border-inline-start-color: var(--success); }
  .fucheck {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border-strong);
    background: transparent; cursor: pointer; flex-shrink: 0; margin-top: 2px;
    display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; line-height: 1;
  }
  .furow.is-done .fucheck { background: var(--success); border-color: var(--success); }
  .furow__body { flex: 1; min-width: 0; }
  .furow__title { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--text-body-color); }
  .furow__meta { font-size: var(--text-xs); color: var(--text-muted); margin-top: 2px; display: flex; gap: var(--space-2); flex-wrap: wrap; }
  .furow__edit { border: none; background: none; cursor: pointer; color: var(--text-muted); font-size: var(--text-body); padding: 2px; }

  /* --- Kanban --- */
  .kanban {
    display: flex; gap: var(--space-3); overflow-x: auto;
    margin-inline: calc(-1 * var(--space-4)); padding: 0 var(--space-4) var(--space-3);
    scroll-snap-type: x proximity;
  }
  .kcol {
    flex: 0 0 252px; scroll-snap-align: start; background: var(--surface-sunken);
    border-radius: var(--radius-md); padding: var(--space-2);
    display: flex; flex-direction: column; gap: var(--space-2); max-height: 62vh;
  }
  .kcol__head {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
    padding: var(--space-2) var(--space-2) 0; font-size: var(--text-xs); font-weight: var(--weight-bold);
    color: var(--text-heading);
  }
  .kcol__count { background: var(--surface-card); color: var(--text-muted); border-radius: var(--radius-pill);
    padding: 2px 8px; font-size: var(--text-2xs); font-weight: var(--weight-bold); }
  .kcol__sum { padding: 0 var(--space-2) var(--space-1); font-size: var(--text-2xs); color: var(--text-muted); }
  .kcol__cards { overflow-y: auto; display: flex; flex-direction: column; gap: var(--space-2); min-height: 40px; }
  .kcard {
    background: var(--surface-card); border-radius: var(--radius-sm); box-shadow: var(--shadow-sm);
    padding: var(--space-3); border-inline-start: 3px solid var(--stage-c, var(--border-accent));
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .kcard:hover { transform: translateY(-1px); box-shadow: var(--shadow-card); }
  .kcard__name { font-weight: var(--weight-semibold); font-size: var(--text-sm); color: var(--text-heading); cursor: pointer; }

  /* --- Horizontal bar list (rankings / revenue) --- */

  .clab { font-size: 9px; fill: var(--text-muted); }
  .charttip {
    position: fixed; z-index: 70; background: #0d2036; color: #fff; pointer-events: none;
    padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600;
    opacity: 0; transition: opacity .12s ease; max-width: 240px; box-shadow: var(--shadow-lg);

  /* --- More menu --- */
  .menu { display: flex; flex-direction: column; gap: var(--space-3); }
  .menuitem {
    display: flex; align-items: center; gap: var(--space-3); background: var(--surface-card);
    border: none; border-radius: var(--radius-md); box-shadow: var(--shadow-card);
    padding: var(--space-4); cursor: pointer; text-align: start; width: 100%;
    border-inline-start: 4px solid var(--border-accent); color: inherit;
    transition: transform .15s ease;
  }
  .menuitem:hover { transform: translateY(-1px); }
  .menuitem__ic { font-size: 24px; line-height: 1; }
  .menuitem__tx { flex: 1; min-width: 0; }
  .menuitem__t { font-size: var(--text-h3); font-weight: var(--weight-semibold); color: var(--text-heading); }
  .menuitem__d { font-size: var(--text-xs); color: var(--text-muted); }
  .menuitem__badge {
    background: var(--error); color: #fff; font-size: var(--text-2xs); font-weight: var(--weight-bold);
    border-radius: var(--radius-pill); padding: 3px 8px; flex-shrink: 0;
  }
  .backchip {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; border: none;
    background: var(--surface-tint); color: var(--text-heading); font-weight: var(--weight-semibold);
    font-size: var(--text-xs); padding: 6px 12px; border-radius: var(--radius-pill); cursor: pointer;
  }

  /* --- Commission result rows --- */
  .crow {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
    padding: var(--space-3) 0; border-bottom: 1px solid var(--border-default);
  }
  .crow__label { flex: 1; font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--text-body-color); }
  .crow__pct { font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--text-accent); min-width: 40px; text-align: end; }
  .crow__amt { font-size: var(--text-body); font-weight: var(--weight-semibold); color: var(--text-heading); min-width: 110px; text-align: end; }
  .crow--subtotal {
    display: block; background: var(--surface-app); border-radius: var(--radius-sm);
    padding: var(--space-3); border-inline-start: 4px solid var(--border-accent); border-bottom: none;
  }
  .crow--subtotal .st__k { font-size: var(--text-xs); color: var(--text-muted); margin-bottom: var(--space-1); }
  .crow--subtotal .st__v { font-size: var(--text-h2); font-weight: var(--weight-bold); color: var(--text-heading); }
  .crow--total {
    display: block; background: var(--brand); border-radius: var(--radius-sm);
    padding: var(--space-4); border-bottom: none;
  }
  .crow--total .tt__k { font-size: var(--text-xs); color: var(--blue-200); margin-bottom: var(--space-2); }
  .crow--total .tt__v { font-size: var(--text-display); font-weight: var(--weight-bold); color: var(--text-on-brand); }

  /* --- History rows --- */
  .hlist { display: flex; flex-direction: column; gap: var(--space-2); }
  .hrow {
    background: var(--surface-card); border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
    padding: var(--space-3) var(--space-4); border-inline-start: 4px solid var(--success);
  }
  .hrow__top { display: flex; justify-content: space-between; gap: var(--space-2); align-items: baseline; }
  .hrow__name { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--text-heading); }
  .hrow__date { font-size: var(--text-2xs); color: var(--text-muted); flex-shrink: 0; }
  .hrow__grid { display: flex; gap: var(--space-3); margin-top: var(--space-2); flex-wrap: wrap; }
  .hrow__grid > div { flex: 1; min-width: 90px; }
  .hcell__k { font-size: var(--text-2xs); color: var(--text-muted); }
  .hcell__v { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--text-heading); white-space: nowrap; }

  /* --- AI match cards --- */
  .match {
    background: var(--surface-app); border-radius: var(--radius-sm); padding: var(--space-3);
    border-inline-start: 3px solid var(--brand-accent); margin-bottom: var(--space-2);
  }
  .match__top { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-2); }
  .match__name { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--text-heading); }
  .match__pct { font-weight: var(--weight-extra); color: var(--success); font-size: var(--text-sm); flex-shrink: 0; }
  .match__sub { font-size: var(--text-xs); color: var(--text-muted); margin-top: 2px; }
  .reasons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--space-2); }
  .reason { font-size: var(--text-2xs); background: var(--surface-tint); color: var(--text-heading);
    border-radius: var(--radius-pill); padding: 3px 8px; font-weight: var(--weight-semibold); }

  /* --- Banners / toast / empty --- */
  .banner { font-size: var(--text-sm); border-radius: var(--radius-sm); padding: 10px 12px; }
  .banner--error { color: var(--error); background: var(--error-bg); }
  .banner--info  { color: var(--text-heading); background: var(--surface-tint); }
  .banner--warning { color: var(--warning); background: var(--warning-bg); }
  .toast {
    position: fixed; inset-block-end: 96px; inset-inline: 0; margin-inline: auto; width: max-content; max-width: 90%;
    background: #0d2036; color: #fff; font-size: var(--text-sm); padding: 10px 16px;
    border-radius: var(--radius-pill); box-shadow: var(--shadow-lg); z-index: 90;
    opacity: 0; transform: translateY(8px); transition: opacity .2s ease, transform .2s ease; pointer-events: none;
  }
  .toast.on { opacity: 1; transform: translateY(0); }

  .empty { text-align: center; color: var(--text-muted); padding: var(--space-8) var(--space-4); font-size: var(--text-sm); }

    width: 22px; height: 22px; border: 3px solid var(--chart-bar-soft); border-top-color: var(--brand-accent);

  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===================================================================== */
  /* 2.5  AUTH SCREEN                                                       */
  /* ===================================================================== */
  .auth {
    min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: var(--space-6); background: var(--surface-app);
  }
  .auth__card {
    width: 100%; max-width: 400px; background: var(--surface-card);
    border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
    border-inline-start: 4px solid var(--brand-accent); padding: var(--space-6);
  }
  .auth__brand { display: flex; align-items: center; gap: var(--space-2);
    font-size: var(--text-h1); font-weight: var(--weight-extra); color: var(--text-heading); }
  .auth__tagline { font-size: var(--text-sm); color: var(--text-muted); margin: var(--space-1) 0 var(--space-6); }

  .auth__switch { font-size: var(--text-sm); color: var(--text-muted); text-align: center; margin-top: var(--space-4); }
  .auth__switch button { border: none; background: none; color: var(--brand-accent); font-weight: var(--weight-semibold); cursor: pointer; font-size: inherit; }

  /* ===================================================================== */
  /* 2.6  MODAL / OVERLAY                                                   */

  }

  .modal {
    width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto;
    background: var(--surface-card); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    box-shadow: var(--shadow-lg); padding: var(--space-5); border-inline-start: 4px solid var(--brand-accent);

  @keyframes slideUp { from { transform: translateY(28px); opacity: .5; } to { transform: none; opacity: 1; } }
  .modal__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-4); }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
  .form-grid .col-2 { grid-column: 1 / -1; }
  .form-actions { display: flex; gap: var(--space-3); margin-top: var(--space-5); }
  .form-actions .btn { flex: 1; }

  /* ===================================================================== */
  /* 2.7  QUOTE TEMPLATE (html2canvas target) — locked to light colors      */
  /* ===================================================================== */
  .quote {
    /* Re-pin semantic tokens so the PNG renders light even in dark mode. */
    --surface-app:#f5f8fc; --surface-card:#ffffff; --surface-tint:#eef5fc; --surface-sunken:#edf1f7;
    --text-heading:#0f4c81; --text-body-color:#1a2433; --text-muted:#5b6b7f;
    --border-default:#e1e8f0; --border-strong:#cbd5e1; --border-accent:#2e7cd6;
    --success:#16a34a; --success-bg:#dcfce7; --error:#dc2626; --error-bg:#fee2e2;

  .quote__date { font-size: 13px; color: var(--gray-500); }
  .quote__section-title { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;

  .quote__prop { display: flex; gap: 14px; align-items: center; }
  .quote__prop-icon { font-size: 40px; }
  .quote__prop-code { font-size: 18px; font-weight: 700; color: var(--brand); }

  .quote__prop-price { margin-inline-start: auto; text-align: end; }

  .quote__quick { display: flex; gap: 10px; margin-top: 14px; }

  .quote__quick .k { font-size: 11px; color: var(--gray-500); }
  .quote__quick .v { font-size: 14px; font-weight: 700; color: var(--brand); }
  .quote__foot { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--gray-200);
    font-size: 12px; color: var(--gray-500); display: flex; justify-content: space-between; }
  .quote-stage { position: fixed; inset-inline-start: -10000px; top: 0; z-index: -1; }

  /* --- FAB --- */
  .fab {
    position: fixed; inset-block-end: 96px; inset-inline-end: max(var(--space-4), calc(50vw - 240px + var(--space-4)));
    width: 56px; height: 56px; border-radius: var(--radius-pill); border: none;
    background: var(--brand); color: #fff; font-size: 28px; line-height: 1; cursor: pointer;
    box-shadow: var(--shadow-lg); z-index: 30;
    display: inline-flex; align-items: center; justify-content: center;
    transition: filter .15s ease, transform .05s ease;

  .fab:hover { filter: brightness(1.1); }
  .fab:active { transform: scale(0.96); }

  /* ===================================================================== */
  /* 2.8  RESPONSIVE                                                        */
  /* ===================================================================== */
  @media (min-width: 768px) {
    .shell { max-width: 720px; box-shadow: var(--shadow-lg); }
    .fab { inset-inline-end: max(var(--space-6), calc(50vw - 360px + var(--space-4))); }
    .overlay { align-items: center; padding: var(--space-4); }
    .modal { border-radius: var(--radius-lg); max-width: 540px; }
    .statrow--4 { grid-template-columns: repeat(4, 1fr); }
  }
  @media (max-width: 420px) {
    .statrow--4 { grid-template-columns: 1fr 1fr; }
  }
  @media (min-width: 1024px) {
    .shell { max-width: 960px; }
    .plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); align-items: start; }
    .fab { inset-inline-end: max(var(--space-6), calc(50vw - 480px + var(--space-4))); }
    .kcol { flex-basis: 280px; }
  }

  /* ===================================================================== */
  /* 2.9  RTL + reduced motion                                             */
  /* ===================================================================== */
  [dir="rtl"] { text-align: right; }
  /* Logical properties handle most mirroring automatically. */
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
  </style>

  function authHeaders(json) {
    const h = { apikey: SUPABASE_ANON_KEY };
    if (state.session && state.session.access_token) h.Authorization = 'Bearer ' + state.session.access_token;
    if (json) h['Content-Type'] = 'application/json';
    return h;
  }

  // --- GoTrue auth endpoints ---
  async function apiSignUp(email, password) {
    const res = await fetch(AUTH_URL + '/signup', {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error_description || data.msg || data.message || 'signup_failed');
    return data;
  }

  async function apiSignIn(email, password) {
    const res = await fetch(AUTH_URL + '/token?grant_type=password', {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error_description || data.msg || 'invalid_grant');
    return data;
  }

  async function apiRefresh(refresh_token) {
    const res = await fetch(AUTH_URL + '/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error('refresh_failed');
    return data;
  }

  async function apiSignOut() {
    if (!state.session) return;
    try {
      await fetch(AUTH_URL + '/logout', { method: 'POST', headers: authHeaders(false) });
    } catch (_) { /* best-effort */ }
  }

  // --- PostgREST data with automatic single-retry on 401 (refresh) ---
  async function restFetch(path, opts = {}, _retried = false) {
    const res = await fetch(REST_URL + path, {
      ...opts,
      headers: { ...authHeaders(true), ...(opts.headers || {}) },
    });
    if (res.status === 401 && !_retried && state.session && state.session.refresh_token) {
      const ok = await tryRefresh();
      if (ok) return restFetch(path, opts, true);
      forceLogout();
      throw new Error('unauthorized');
    }
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || err.hint || ('HTTP ' + res.status));
    }
    if (res.status === 204) return null;
    return res.json();
  }

  const rest = {
    list:   (table, order) => restFetch('/' + table + '?select=*&order=' + order),
    create: (table, row)   => restFetch('/' + table, { method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify(row) }),
    update: (table, id, row) => restFetch('/' + table + '?id=eq.' + encodeURIComponent(id), { method: 'PATCH', headers: { Prefer: 'return=representation' }, body: JSON.stringify(row) }),
    remove: (table, id)    => restFetch('/' + table + '?id=eq.' + encodeURIComponent(id), { method: 'DELETE' }),
  };

  /* ===================================================================== */
  /* 8.  AUTH LOGIC                                                         */
  /* ===================================================================== */
  function persistSession(tokenPayload) {
    const sess = {
      access_token: tokenPayload.access_token,
      refresh_token: tokenPayload.refresh_token,
      expires_at: Date.now() + (tokenPayload.expires_in || 3600) * 1000,
      user: tokenPayload.user || null,
    };
    state.session = sess;
    localStorage.setItem(SESSION_KEY, JSON.stringify(sess));
  }

  function clearSession() {
    state.session = null;
    localStorage.removeItem(SESSION_KEY);
  }

  async function tryRefresh() {
    try {
      const data = await apiRefresh(state.session.refresh_token);
      if (!data.access_token) return false;
      persistSession(data);
      return true;
    } catch (_) { return false; }
  }

  function forceLogout() {
    clearSession();
    state.screen = 'dashboard';
    state.properties = []; state.clients = []; state.deals = []; state.followups = [];
    renderRoot();
  }

  async function restoreSession() {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return;
    try {
      const sess = JSON.parse(raw);
      if (!sess || !sess.access_token) return;
      state.session = sess;
      if (!sess.expires_at || sess.expires_at - Date.now() < 60000) {
        const ok = await tryRefresh();
        if (!ok) { clearSession(); return; }
      }
    } catch (_) { clearSession(); }
  }

  async function handleAuthSubmit() {
    const emailEl = document.getElementById('auth-email');
    const passEl = document.getElementById('auth-password');
    const email = emailEl ? emailEl.value.trim() : '';
    const password = passEl ? passEl.value : '';
    if (!email || !password) { state.authError = t('loginFailed'); renderRoot(); return; }

    state.authBusy = true; state.authError = null; state.authInfo = null; renderRoot();
    try {
      if (state.authMode === 'signup') {
        const data = await apiSignUp(email, password);
        if (data.access_token) {
          persistSession(data);
          await afterLogin();
          return;
        }
        state.authMode = 'login';
        state.authInfo = t('checkEmail');
      } else {
        const data = await apiSignIn(email, password);
        persistSession(data);
        await afterLogin();
        return;
      }
    } catch (err) {
      state.authError = state.authMode === 'signup'
        ? (String(err.message).match(/already|registered|exists/i) ? t('signupFailed') + ' — ' + err.message : t('signupFailed'))
        : t('loginFailed');
    } finally {
      state.authBusy = false;
      renderRoot();
    }
  }

  async function afterLogin() {
    state.authBusy = false;
    renderRoot();
    await loadAll();
  }

  async function handleLogout() {
    await apiSignOut();
    forceLogout();
  }

  const L = () => I18N[state.lang];

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
  const num = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
  const groupNum = (n) => Math.round(n).toLocaleString('en-US'); // Western digits, comma-grouped per spec

  function fmtMoney(n) { return groupNum(n) + ' ' + t('currency'); }
  function fmtCompact(n) {
    const a = Math.abs(n);
    const trim = (v) => { const s = v.toFixed(1); return s.endsWith('.0') ? s.slice(0, -2) : s; };
    if (a >= 1e9) return trim(n / 1e9) + 'B';
    if (a >= 1e6) return trim(n / 1e6) + 'M';
    if (a >= 1e3) return trim(n / 1e3) + 'K';
    return groupNum(n);
  }
  function fmtPrice(p) {
    const cur = t('currency');
    if (p.type === 'rent') return groupNum(p.price) + ' ' + cur + t('month');

  function monthLabel(key) { // '2026-07' -> 'Jul 2026' / 'يول 2026'
    if (!key) return '—';

  }

  function thisMonthKey() { return new Date().toISOString().slice(0, 7); }

  function fmtDue(f) {
    const d = new Date(f.due_at);
    if (isNaN(d)) return '';
    const dateStr = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const timeStr = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    return (dateStr === localTodayKey() ? t('today') : dateStr) + ' · ' + timeStr;
  }
  function localTodayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

  async function loadAll() {
    state.loading = true; state.dataError = null; renderRoot();
    const jobs = [
      rest.list('properties', 'code.asc').then(r => { state.properties = r || []; }),
      rest.list('clients', 'created_at.desc').then(r => { state.clients = r || []; }),
      rest.list('deals', 'created_at.desc').then(r => { state.deals = r || []; }),
      rest.list('followups', 'due_at.asc').then(r => { state.followups = r || []; }),
    ];
    const results = await Promise.allSettled(jobs);
    const failed = results.filter(r => r.status === 'rejected');
    if (failed.length) {
      const msgs = failed.map(f => String(f.reason && f.reason.message || f.reason));
      const missingTable = msgs.some(m => /relation|does not exist|schema cache|404/i.test(m));
      state.dataError = msgs[0] + (missingTable ? ' — ' + t('dbHint') : '');
    }
    state.loading = false;
    renderRoot();
    checkDueFollowups();

  /* ===================================================================== */
  /* 10.  BUSINESS CALCULATIONS                                             */
  /* ===================================================================== */
  function calcCommission(price, pct, agentShare, companyShare) {
    const total = num(price) * num(pct) / 100;
    return {
      total,
      agent: total * num(agentShare) / 100,
      company: total * num(companyShare) / 100,
    };
  }
  function dealCommission(d) {
    return calcCommission(d.value, d.commission_pct, d.agent_share_pct, d.company_share_pct);
  }
  const closedDeals = () => state.deals.filter(d => d.stage === 'closed' && d.closed_at);

  function lastNMonths(n) {
    const out = [];
    const d = new Date();
    d.setDate(1);
    for (let i = n - 1; i >= 0; i--) {
      const dd = new Date(d.getFullYear(), d.getMonth() - i, 1);
      const key = dd.getFullYear() + '-' + String(dd.getMonth() + 1).padStart(2, '0');
      out.push({ key, label: MONTHS_SHORT[state.lang][dd.getMonth()] });
    }
    return out;
  }

  function monthlySalesSeries(n) {
    const months = lastNMonths(n);
    const sums = {};
    closedDeals().forEach(d => {
      const k = String(d.closed_at).slice(0, 7);
      sums[k] = (sums[k] || 0) + num(d.value);
    });
    return months.map(m => ({ label: m.label, key: m.key, value: sums[m.key] || 0 }));
  }

  function groupSum(rows, keyFn, valFn) {
    const map = new Map();
    rows.forEach(r => {
      const k = keyFn(r);
      if (!k) return;
      const cur = map.get(k) || { key: k, value: 0, count: 0 };
      cur.value += valFn(r); cur.count += 1;
      map.set(k, cur);
    });
    return [...map.values()].sort((a, b) => b.value - a.value);
  }

  function dashboardMetrics() {
    const mk = thisMonthKey();
    const closed = closedDeals();
    const thisMonth = closed.filter(d => String(d.closed_at).slice(0, 7) === mk);
    const sales = thisMonth.reduce((s, d) => s + num(d.value), 0);
    const comm = thisMonth.reduce((s, d) => s + dealCommission(d).total, 0);
    const activeClients = state.clients.filter(c => c.stage !== 'contract_signed').length;
    const visits = state.followups.filter(f => f.kind === 'visit' && !f.done).length;
    const topAgents = groupSum(closed, d => (d.agent || '').trim(), d => dealCommission(d).total).slice(0, 5);
    const byProject = groupSum(closed, d => { const p = propById(d.property_id); return p ? (p.project || p.code) : null; }, d => num(d.value));
    const mostSold = byProject.length ? byProject.reduce((a, b) => (b.count > a.count ? b : a), byProject[0]) : null;
    return { sales, comm, activeClients, visits, topAgents, mostSold };
  }

  function dealArea(d) {
    const p = propById(d.property_id);
    if (!p || !p.address_en) return null;
    return String(p.address_en).split(',')[0].trim();
  }

  /* ===================================================================== */
  /* 11.  AI HEURISTICS (client-side scoring over portfolio data)           */
  /* ===================================================================== */
  function aiMatchesForClient(client) {
    const budget = num(client.budget);
    const area = (client.preferred_area || '').trim().toLowerCase();
    return state.properties.map(p => {
      let score = 0; const reasons = [];
      if (p.status === 'available') { score += 15; reasons.push(t('reasonAvailable')); }
      if (budget > 0 && num(p.price) <= budget * 1.1) {
        const closeness = Math.max(0, 1 - Math.abs(budget - num(p.price)) / budget);
        score += Math.round(25 + 15 * closeness);
        reasons.push(t('reasonBudget'));
      }
      if (area && ((p.address_en || '').toLowerCase().includes(area)
        || (p.address_ar || '').includes((client.preferred_area || '').trim())
        || (p.project || '').toLowerCase().includes(area))) {
        score += 25; reasons.push(t('reasonArea'));
      }
      if (client.preferred_unit_type && p.unit_type === client.preferred_unit_type) {
        score += 20; reasons.push(t('reasonType'));
      }
      return { p, score: Math.min(99, score), reasons };
    }).filter(m => m.score >= 30).sort((a, b) => b.score - a.score).slice(0, 5);
  }

  function aiSimilarProps(prop) {
    return state.properties.filter(p => p.id !== prop.id).map(p => {
      let score = 0; const reasons = [];
      if (prop.unit_type && p.unit_type === prop.unit_type) { score += 30; reasons.push(t('simSameType')); }
      if (prop.project && p.project === prop.project) { score += 25; reasons.push(t('simSameProject')); }
      else if (prop.developer && p.developer === prop.developer) { score += 15; reasons.push(t('simSameDev')); }
      const a = num(prop.price), b = num(p.price);
      if (a > 0 && b > 0) {
        const diff = Math.abs(a - b) / a;
        if (diff <= 0.2) { score += Math.round(30 * (1 - diff / 0.2)); reasons.push(t('simPrice')); }
      }
      const areaA = (prop.address_en || '').split(',')[0].trim().toLowerCase();
      const areaB = (p.address_en || '').split(',')[0].trim().toLowerCase();
      if (areaA && areaA === areaB) { score += 15; reasons.push(t('simArea')); }
      return { p, score: Math.min(99, score), reasons };
    }).filter(m => m.score >= 25).sort((a, b) => b.score - a.score).slice(0, 4);
  }

  function aiGrowthForecast(p) {
    const reasons = [{ k: t('gBase'), v: '+5%' }];
    let pct = 5;
    if (p.delivery && new Date(p.delivery) > new Date()) { pct += 3; reasons.push({ k: t('gDelivery'), v: '+3%' }); }
    const area = (p.address_en || '').split(',')[0].trim().toLowerCase();
    if (area) {
      const demand = state.clients.filter(c => (c.preferred_area || '').toLowerCase().includes(area)).length;
      if (demand > 0) {
        const add = Math.min(4, demand);
        pct += add;
        reasons.push({ k: t('gDemand') + ' (' + demand + ')', v: '+' + add + '%' });
      }
    }
    if (p.developer) {
      const devSold = state.properties.filter(x => x.developer === p.developer && x.status === 'sold').length;
      if (devSold > 0) { pct += 2; reasons.push({ k: t('gDeveloper'), v: '+2%' }); }
    }
    const in5 = num(p.price) * Math.pow(1 + pct / 100, 5);
    return { low: Math.max(0, pct - 2), high: pct + 2, mid: pct, in5, reasons };
  }

  /* ===================================================================== */
  /* 12.  CHART HELPERS (inline SVG + HTML bars, themed via CSS variables)  */
  /* ===================================================================== */
  function svgBarChart(items, opts = {}) {
    const W = opts.width || 340, H = opts.height || 170;
    const padL = 6, padR = 6, padB = 22, padT = 16;
    const max = Math.max(...items.map(i => i.value), 1);
    const iw = (W - padL - padR) / Math.max(items.length, 1);
    const bw = Math.max(6, Math.min(26, iw * 0.55));
    let bars = '';
    items.forEach((it, idx) => {
      const cx = padL + iw * idx + iw / 2;
      if (it.value > 0) {
        const h = Math.max(4, (H - padT - padB) * (it.value / max));
        const x = cx - bw / 2;
        const y = H - padB - h;
        const r = Math.min(4, bw / 2, h);
        // Rounded top, flat baseline (data-end treatment).
        const d = 'M' + x + ',' + (y + r)
          + ' a' + r + ',' + r + ' 0 0 1 ' + r + ',-' + r
          + ' h' + (bw - 2 * r)
          + ' a' + r + ',' + r + ' 0 0 1 ' + r + ',' + r
          + ' v' + (H - padB - y - r) + ' h-' + bw + ' z';
        bars += '<path class="cbar" d="' + d + '" fill="var(--chart-bar)" data-tip="' + esc(it.tip || (it.label + ': ' + fmtCompact(it.value))) + '"></path>';
        if (it.value === max) {
          bars += '<text class="cval" x="' + cx + '" y="' + (y - 5) + '" text-anchor="middle">' + esc(fmtCompact(it.value)) + '</text>';
        }
      }
      bars += '<text class="clab" x="' + cx + '" y="' + (H - 7) + '" text-anchor="middle">' + esc(it.label) + '</text>';
    });
    return '<svg class="chartbox" viewBox="0 0 ' + W + ' ' + H + '" role="img" style="display:block" dir="ltr">'
      + '<line x1="' + padL + '" y1="' + (H - padB) + '" x2="' + (W - padR) + '" y2="' + (H - padB) + '" stroke="var(--border-default)" stroke-width="1"/>'
      + bars + '</svg>';
  }

  function hbarList(items, valFmt) {
    if (!items.length) return '<div class="empty">' + esc(t('noData')) + '</div>';
    const max = Math.max(...items.map(i => i.value), 1);
    return '<div class="hbar">' + items.map(it => `
      <div class="hbar__row">
        <span class="hbar__label" title="${esc(it.key)}">${it.prefix || ''}${esc(it.key)}</span>
        <span class="hbar__track"><span class="hbar__fill" style="width:${Math.max(3, Math.round(100 * it.value / max))}%"></span></span>
        <span class="hbar__val">${esc(valFmt ? valFmt(it) : fmtCompact(it.value))}</span>
      </div>`).join('') + '</div>';
  }

  function clientMatchesFilters(c) {
    if (state.clientFilter !== 'all' && c.stage !== state.clientFilter) return false;
    const q = state.clientSearch.trim().toLowerCase();
    if (!q) return true;
    return [c.name, c.phone, c.email, c.preferred_area].some(v => v && String(v).toLowerCase().includes(q));
  }

  function renderClients() {
    const counts = {};
    state.clients.forEach(c => { counts[c.stage] = (counts[c.stage] || 0) + 1; });
    const chips = ['all', ...CLIENT_STAGES].map(s => `
      <button class="chip ${state.clientFilter===s?'on':''}" data-action="client-filter" data-filter="${s}">
        ${esc(s==='all' ? t('all') : stageLabel(s))}<span class="cnt">${s==='all' ? state.clients.length : (counts[s]||0)}</span></button>`).join('');
    return `
      <div class="screen">
        ${loadErrorBanner()}
        <div class="field__wrap">
          <input class="field__input" id="client-search" data-search="client" placeholder="🔍 ${esc(t('search'))}" value="${esc(state.clientSearch)}">
        </div>
        <div class="chips">${chips}</div>
        <div id="client-list">${renderClientList()}</div>
      </div>`;
  }

  function renderClientList() {
    if (state.loading) return `<div class="spinner"></div>`;

    if (!state.clients.length) return `<div class="empty">${esc(t('noClients'))}</div>`;
    if (!filtered.length) return `<div class="empty">${esc(t('noResults'))}</div>`;
    return `<div class="plist">${filtered.map(renderClientCard).join('')}</div>`;
  }

  function renderFuRow(f) {
    const c = clientById(f.client_id);
    const late = !f.done && new Date(f.due_at) < new Date();
    return `
      <div class="furow ${f.done?'is-done':''} ${late?'is-late':''}">
        <button class="fucheck" data-action="fu-toggle" data-id="${esc(f.id)}" aria-label="${esc(t('confirm'))}">${f.done?'✓':''}</button>
        <div class="furow__body">
          <div class="furow__title">${esc(FU_KIND_ICONS[f.kind] || '📌')} ${esc(f.title)}</div>
          <div class="furow__meta">
            <span>${esc(fmtDue(f))}</span>
            ${c ? `<span>· 👤 ${esc(c.name)}</span>` : ''}
            <span>· ${esc(fuKindLabel(f.kind))}</span>
          </div>
          ${f.notes ? `<div class="furow__meta">${esc(f.notes)}</div>` : ''}
        </div>
        <button class="furow__edit" data-action="edit-fu" data-id="${esc(f.id)}" aria-label="${esc(t('edit'))}">✏️</button>
      </div>`;
  }

  function renderFollowups() {
    if (state.loading) return `<div class="screen"><div class="spinner"></div></div>`;
    const now = new Date();
    const today = localTodayKey();
    const pending = state.followups.filter(f => !f.done);
    const overdue = pending.filter(f => new Date(f.due_at) < now && fmtDueDateKey(f) !== today);
    const todays = pending.filter(f => fmtDueDateKey(f) === today);
    const upcoming = pending.filter(f => new Date(f.due_at) >= now && fmtDueDateKey(f) !== today);
    const done = state.followups.filter(f => f.done);
    const ns = notifStatus();
    const notifBtn =
      ns === 'granted' ? `<div class="banner banner--info">🔔 ${esc(t('notifsOn'))}</div>` :
      ns === 'denied' ? `<div class="banner banner--warning">🔕 ${esc(t('notifBlocked'))}</div>` :
      ns === 'unsupported' ? '' :
      `<button class="btn btn--secondary btn--block" data-action="enable-notifs">🔔 ${esc(t('enableNotifs'))}</button>`;
    const group = (title, arr) => arr.length ? `
      <div class="fugroup">
        <div class="fugroup__title">${esc(title)} · ${arr.length}</div>
        ${arr.map(renderFuRow).join('')}
      </div>` : '';
    const empty = !state.followups.length ? `<div class="empty">${esc(t('noFollowups'))}</div>` : '';
    return `
      <div class="screen">
        <button class="backchip" data-action="goto" data-screen="more">← ${esc(t('back'))}</button>
        ${loadErrorBanner()}
        ${notifBtn}
        ${group(t('overdue'), overdue)}
        ${group(t('today'), todays)}
        ${group(t('upcoming'), upcoming)}
        ${empty}
        ${done.length ? `
          <button class="backchip" data-action="fu-show-done">${state.fuShowDone ? '▾' : '▸'} ${esc(t('completedGroup'))} · ${done.length}</button>

  /* ===================================================================== */
  function historyRows() {
    return closedDeals().map(d => {
      const c = clientById(d.client_id);
      const p = propById(d.property_id);
      const comm = dealCommission(d);
      return {
        d, comm,
        month: String(d.closed_at).slice(0, 7),
        clientName: c ? c.name : (d.title || '—'),
        agent: (d.agent || '').trim() || '—',
        project: p ? (p.project || p.code) : '—',
      };
    }).filter(r =>
      (state.histMonth === 'all' || r.month === state.histMonth) &&
      (state.histAgent === 'all' || r.agent === state.histAgent) &&
      (state.histProject === 'all' || r.project === state.histProject)
    ).sort((a, b) => String(b.d.closed_at).localeCompare(String(a.d.closed_at)));
  }

    const months = [...new Set(all.map(d => String(d.closed_at).slice(0, 7)))].sort().reverse();
    const agents = [...new Set(all.map(d => (d.agent || '').trim() || '—'))].sort();
    const projects = [...new Set(all.map(d => { const p = propById(d.property_id); return p ? (p.project || p.code) : '—'; }))].sort();
    const rows = historyRows();
    const sumValue = rows.reduce((s, r) => s + num(r.d.value), 0);
    const sumTotal = rows.reduce((s, r) => s + r.comm.total, 0);
    const sumAgent = rows.reduce((s, r) => s + r.comm.agent, 0);
    const filterSel = (label, key, current, options, fmt) => `
      <label class="field" style="flex:1;min-width:100px">
        <span class="field__label" style="font-size:var(--text-xs)">${esc(label)}</span>
        <div class="field__wrap"><select class="field__select" data-action-change="hist-filter" data-key="${key}" style="padding:8px 10px;font-size:var(--text-sm)">
          <option value="all">${esc(t('all'))}</option>
          ${options.map(o => `<option value="${esc(o)}" ${current===o?'selected':''}>${esc(fmt ? fmt(o) : o)}</option>`).join('')}

        <div style="display:flex;gap:var(--space-2)">
          <button class="btn btn--secondary btn--sm" style="flex:1" data-action="export-csv">📊 ${esc(t('exportCsv'))}</button>
          <button class="btn btn--secondary btn--sm" style="flex:1" data-action="export-pdf">📄 ${esc(t('exportPdf'))}</button>

        ${rows.length ? `<div class="hlist">${rows.map(r => `
          <div class="hrow">
            <div class="hrow__top">
              <span class="hrow__name">${esc(r.clientName)} — ${esc(r.project)}</span>
              <span class="hrow__date">${esc(r.d.closed_at)}</span>
            </div>
            <div class="hrow__grid">
              <div><div class="hcell__k">${esc(t('valueW'))}</div><div class="hcell__v">${esc(fmtCompact(num(r.d.value)))}</div></div>
              <div><div class="hcell__k">${esc(t('totalCommission'))}</div><div class="hcell__v">${esc(fmtCompact(r.comm.total))}</div></div>
              <div><div class="hcell__k">${esc(t('agentCommission'))}</div><div class="hcell__v">${esc(fmtCompact(r.comm.agent))}</div></div>
              <div><div class="hcell__k">${esc(t('agentF'))}</div><div class="hcell__v">${esc(r.agent)}</div></div>

  function exportHistoryCsv() {
    const rows = historyRows();
    const head = [t('dateW'), t('client'), t('projectF'), t('agentF'), t('valueW'), t('commPct') + ' %', t('totalCommission'), t('agentCommission'), t('companyCommission')];
    const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const lines = [head.map(q).join(',')];
    rows.forEach(r => {
      lines.push([r.d.closed_at, r.clientName, r.project, r.agent, num(r.d.value),
        num(r.d.commission_pct), Math.round(r.comm.total), Math.round(r.comm.agent), Math.round(r.comm.company)].map(q).join(','));
    });
    // BOM so Excel opens Arabic text as UTF-8.
    const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ringroads-commissions-' + (state.histMonth === 'all' ? 'all' : state.histMonth) + '.csv';
    a.click();
    URL.revokeObjectURL(a.href);
    toast(t('saved'));
  }

  function exportHistoryPdf() {
    const rows = historyRows();
    const sumTotal = rows.reduce((s, r) => s + r.comm.total, 0);
    const sumAgent = rows.reduce((s, r) => s + r.comm.agent, 0);
    const sumCompany = rows.reduce((s, r) => s + r.comm.company, 0);
    const filters = [
      state.histMonth !== 'all' ? t('monthF') + ': ' + monthLabel(state.histMonth) : null,
      state.histAgent !== 'all' ? t('agentF') + ': ' + state.histAgent : null,
      state.histProject !== 'all' ? t('projectF') + ': ' + state.histProject : null,
    ].filter(Boolean).join(' · ') || t('all');

  function renderAnalytics() {
    if (state.loading) return `<div class="screen"><div class="spinner"></div></div>`;
    const series = monthlySalesSeries(12);
    const hasSales = series.some(s => s.value > 0);
    const totalDeals = state.deals.length;
    const closedCount = state.deals.filter(d => d.stage === 'closed').length;
    const conv = totalDeals ? Math.round(100 * closedCount / totalDeals) : 0;
    const closed = closedDeals();
    const funnel = DEAL_STAGES.map((stg, i) => {
      // Funnel counts deals at-or-past each stage, so it narrows monotonically.
      const count = state.deals.filter(d => DEAL_STAGES.indexOf(d.stage) >= i).length;
      return { key: dealStageLabel(stg), value: count };
    });
    const revenue = groupSum(closed, d => { const p = propById(d.property_id); return p ? (p.project || p.code) : (d.title || '—'); }, d => num(d.value)).slice(0, 5);
    const devs = groupSum(closed, d => { const p = propById(d.property_id); return p && p.developer ? p.developer : null; }, d => num(d.value)).slice(0, 5);
    const locs = groupSum(closed, d => dealArea(d), d => num(d.value)).slice(0, 5);
    return `
      <div class="screen">
        <button class="backchip" data-action="goto" data-screen="more">← ${esc(t('back'))}</button>
        <section class="panel panel--brand">
          <h3 class="panel__title">📊 ${esc(t('salesByMonth'))}</h3>
          ${hasSales ? svgBarChart(series.map(s => ({ label: s.label, value: s.value, tip: monthLabel(s.key) + ' — ' + fmtMoney(s.value) })), { width: 420 })
                     : `<div class="empty">${esc(t('noSalesData'))}</div>`}
        </section>

        <section class="panel panel--success">
          <h3 class="panel__title">🎯 ${esc(t('convRate'))}</h3>
          <div style="display:flex;align-items:baseline;gap:var(--space-3)">
            <div style="font-size:40px;font-weight:var(--weight-extra);color:var(--success);line-height:1">${conv}%</div>
            <div style="font-size:var(--text-sm);color:var(--text-muted)">${esc(t('convCaption'))} (${closedCount}/${totalDeals || 0})</div>
          </div>
        </section>

        <section class="panel">
          <h3 class="panel__title">⏬ ${esc(t('funnelTitle'))}</h3>
          ${totalDeals ? hbarList(funnel, (it) => String(it.value)) : `<div class="empty">${esc(t('noData'))}</div>`}
        </section>

        <section class="panel">
          <h3 class="panel__title">🏗️ ${esc(t('revenueByProject'))}</h3>
          ${hbarList(revenue)}
        </section>

        <section class="panel">
          <h3 class="panel__title">🏢 ${esc(t('topDevelopers'))}</h3>
          ${hbarList(devs)}
        </section>

        <section class="panel">
          <h3 class="panel__title">📍 ${esc(t('topLocations'))}</h3>
          ${hbarList(locs)}
        </section>
      </div>`;
  }

  async function downloadQuotePng() {
    const stage = document.getElementById('quote-stage');
    stage.innerHTML = quoteTemplateHTML();
    const node = stage.firstElementChild;
    try {
      if (document.fonts) {
        try { await document.fonts.load('700 24px Cairo'); await document.fonts.load('400 14px Cairo'); } catch (_) {}
        await document.fonts.ready;
      }
      const canvas = await html2canvas(node, { backgroundColor: '#ffffff', scale: 2, useCORS: true });
      const p = propById(state.calc.propId);
      const name = 'ring-roads-quote-' + (p ? p.code : 'commission') + '-' + Date.now() + '.png';
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = name; a.click();
        URL.revokeObjectURL(url);
        toast(t('saved'));
      }, 'image/png');
    } catch (err) {
      toast('PNG export failed: ' + err.message);
    } finally {
      stage.innerHTML = '';
    }
  }

  /* 27.  NOTIFICATIONS (browser Notification API — fires while app open)   */
  /* ===================================================================== */
  function notifStatus() {
    if (!('Notification' in window)) return 'unsupported';
    return Notification.permission; // 'default' | 'granted' | 'denied'
  }
  async function enableNotifs() {
    if (!('Notification' in window)) { toast(t('notifUnsupported')); return; }
    const p = await Notification.requestPermission();
    if (p === 'granted') { toast(t('notifsOn')); checkDueFollowups(); }
    renderRoot();
  }
  function checkDueFollowups() {
    if (notifStatus() !== 'granted') return;
    const now = Date.now();
    let seen;
    try { seen = JSON.parse(localStorage.getItem('ringroads_notified') || '[]'); } catch (_) { seen = []; }
    let changed = false;
    state.followups.forEach(f => {
      if (f.done || seen.includes(f.id)) return;
      const due = new Date(f.due_at).getTime();
      if (isNaN(due)) return;
      // Notify from 15 min before due until 60 min after (once per follow-up).
      if (due - now < 15 * 60000 && now - due < 60 * 60000) {
        const c = clientById(f.client_id);
        try {
          new Notification('Ring Roads — ' + f.title, {
            body: (c ? c.name + ' · ' : '') + fmtDue(f),
            tag: 'ringroads-fu-' + f.id,
          });
        } catch (_) { /* some browsers require a service worker */ }
        seen.push(f.id);
        changed = true;
      }
    });
    if (changed) localStorage.setItem('ringroads_notified', JSON.stringify(seen.slice(-200)));
  }
