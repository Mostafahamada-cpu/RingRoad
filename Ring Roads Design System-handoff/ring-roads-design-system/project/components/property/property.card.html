<!-- @dsCard group="Components" viewport="700x300" name="PropertyCard & StatusBadge" subtitle="Expandable listing + status pills" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-app); font-family: var(--font-sans); }
  .stack { display: flex; flex-direction: column; gap: 12px; max-width: 460px; }
  .badges { display: flex; gap: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { PropertyCard, StatusBadge } = window.RingRoadsDesignSystem_ef90d6;
  function Demo() {
    const [open, setOpen] = React.useState(true);
    return (
      <div className="stack">
        <div className="badges">
          <StatusBadge status="available">متاح · Available</StatusBadge>
          <StatusBadge status="sold">مباع · Sold</StatusBadge>
          <StatusBadge status="rented">مؤجر · Rented</StatusBadge>
        </div>
        <PropertyCard
          expanded={open} onToggle={() => setOpen(!open)}
          t={{ beds: 'غرف · Beds', baths: 'حمام · Baths', type: 'نوع · Type', finish: 'تشطيب · Finish', unit: 'الوحدة · Unit', agent: 'الوكيل · Agent', registered: 'التسجيل · Registered' }}
          property={{
            code: 'A-101', address: 'الشيخ زايد · Sheikh Zayed', price: '2,500,000 EGP',
            icon: '🏠', status: 'available', statusLabel: 'متاح · Available',
            beds: 3, baths: 2, typeLabel: 'بيع · Sale', finish: 'فاخر · Luxury',
            unit: 'Apt 1', agent: 'محمد أحمد · M. Ahmed', registered: '2024-01-15',
          }}
        />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
