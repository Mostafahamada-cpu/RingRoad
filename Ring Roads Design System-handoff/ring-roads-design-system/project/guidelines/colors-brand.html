<!-- @dsCard group="Colors" viewport="700x170" name="Brand Blue" subtitle="Core blue ramp — 700 is primary" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--surface-card); font-family:var(--font-sans); }
  .ramp { display:flex; gap:0; border-radius:var(--radius-md); overflow:hidden; }
  .sw { flex:1; height:96px; display:flex; flex-direction:column; justify-content:flex-end; padding:8px; box-sizing:border-box; }
  .sw span { font-size:11px; font-weight:600; }
  .lite { color:var(--gray-900); } .dark { color:#fff; }
</style></head>
<body>
<div class="ramp">
  <div class="sw dark" style="background:var(--blue-900)"><span>900</span></div>
  <div class="sw dark" style="background:var(--blue-800)"><span>800</span></div>
  <div class="sw dark" style="background:var(--blue-700)"><span>700 ·primary</span></div>
  <div class="sw dark" style="background:var(--blue-600)"><span>600</span></div>
  <div class="sw dark" style="background:var(--blue-500)"><span>500 ·accent</span></div>
  <div class="sw dark" style="background:var(--blue-400)"><span>400</span></div>
  <div class="sw lite" style="background:var(--blue-300)"><span>300</span></div>
  <div class="sw lite" style="background:var(--blue-200)"><span>200</span></div>
  <div class="sw lite" style="background:var(--blue-100)"><span>100</span></div>
  <div class="sw lite" style="background:var(--blue-50)"><span>50 ·tint</span></div>
</div>
</body></html>
