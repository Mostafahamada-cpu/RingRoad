<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:22px; background:var(--surface-card); font-family:var(--font-sans); display:flex; gap:18px; align-items:flex-end; }
  .box { background:var(--surface-tint); border:1px solid var(--blue-200); width:88px; height:72px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:6px; font-size:11px; color:var(--text-muted); }
</style></head>
<body>
  <div class="box" style="border-radius:var(--radius-xs)">xs · 6</div>
  <div class="box" style="border-radius:var(--radius-sm)">sm · 8</div>
  <div class="box" style="border-radius:var(--radius-md)">md · 12</div>
  <div class="box" style="border-radius:var(--radius-lg)">lg · 16</div>
  <div class="box" style="border-radius:var(--radius-pill)">pill</div>
</body></html>
