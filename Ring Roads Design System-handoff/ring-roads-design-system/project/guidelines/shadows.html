<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:26px; background:var(--surface-app); font-family:var(--font-sans); display:flex; gap:22px; }
  .card { flex:1; background:#fff; border-radius:var(--radius-md); height:82px; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--text-muted); }
</style></head>
<body>
  <div class="card" style="box-shadow:var(--shadow-sm)">shadow-sm</div>
  <div class="card" style="box-shadow:var(--shadow-card)">shadow-card</div>
  <div class="card" style="box-shadow:var(--shadow-stat)">shadow-stat</div>
  <div class="card" style="box-shadow:var(--shadow-lg)">shadow-lg</div>
</body></html>
