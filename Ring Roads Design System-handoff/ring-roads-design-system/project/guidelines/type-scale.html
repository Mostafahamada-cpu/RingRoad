<!-- @dsCard group="Type" viewport="700x220" name="Type Scale" subtitle="Cairo — display down to labels" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:22px; background:var(--surface-card); font-family:var(--font-sans); color:var(--text-body); }
  .row { display:flex; align-items:baseline; gap:14px; padding:5px 0; border-bottom:1px solid var(--border-default); }
  .tag { width:120px; font-size:11px; color:var(--text-muted); flex-shrink:0; }
</style></head>
<body>
  <div class="row"><span class="tag">display · 28</span><span style="font-size:var(--text-display);font-weight:700;color:var(--text-heading)">Ring Roads</span></div>
  <div class="row"><span class="tag">h2 · 18</span><span style="font-size:var(--text-h2);font-weight:700;color:var(--text-heading)">23,200 EGP</span></div>
  <div class="row"><span class="tag">h3 · 16</span><span style="font-size:var(--text-h3);font-weight:600">Transaction amounts</span></div>
  <div class="row"><span class="tag">body · 14</span><span style="font-size:var(--text-body)">Sheikh Zayed, Giza — 3 beds, 2 baths</span></div>
  <div class="row"><span class="tag">sm · 13</span><span style="font-size:var(--text-sm);color:var(--text-muted)">Registered 2024-01-15</span></div>
  <div class="row"><span class="tag">2xs · 11</span><span style="font-size:var(--text-2xs);font-weight:600;letter-spacing:var(--tracking-label)">AVAILABLE</span></div>
</body></html>
