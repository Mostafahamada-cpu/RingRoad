<!-- @dsCard group="Brand" viewport="700x180" name="Wordmark" subtitle="No supplied logo — set in Cairo Bold" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:0; font-family:var(--font-sans); display:flex; }
  .a { flex:1; background:var(--brand); color:#fff; padding:26px; display:flex; flex-direction:column; justify-content:center; }
  .b { flex:1; background:var(--surface-card); color:var(--brand); padding:26px; display:flex; flex-direction:column; justify-content:center; border:1px solid var(--border-default); }
  .mark { display:flex; align-items:center; gap:10px; font-size:26px; font-weight:800; letter-spacing:-0.01em; }
  .glyph { font-size:26px; }
  .sub { font-size:12px; opacity:.8; margin-top:6px; }
  .ar { font-size:22px; font-weight:800; margin-top:4px; }
</style></head>
<body>
  <div class="a">
    <div class="mark"><span class="glyph">🏢</span> Ring Roads</div>
    <div class="ar">رينج رودز</div>
    <div class="sub">On brand blue</div>
  </div>
  <div class="b">
    <div class="mark"><span class="glyph">🏢</span> Ring Roads</div>
    <div class="ar">رينج رودز</div>
    <div class="sub">On white</div>
  </div>
</body></html>
